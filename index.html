<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/margo-logo-blue.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Title & Description (will be updated dynamically by i18n) -->
    <title>Margo Guest App | Your Digital Concierge</title>
    <meta name="description" content="Access your personalized guest portal for check-in, services, and local recommendations." />
    <meta name="author" content="Margo Hospitality" />
    
    <!-- Open Graph -->
    <meta property="og:site_name" content="Margo Hospitality" />
    <meta property="og:title" content="Margo Guest App | Your Digital Concierge" />
    <meta property="og:description" content="Access your personalized guest portal for check-in, services, and local recommendations." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://riad-guest-hub.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MargoHospitality" />
    <meta name="twitter:title" content="Margo Guest App | Your Digital Concierge" />
    <meta name="twitter:description" content="Access your personalized guest portal for check-in, services, and local recommendations." />
    <meta name="twitter:image" content="https://riad-guest-hub.vercel.app/og-image.png" />
    
    <!-- Language alternates -->
    <link rel="alternate" hreflang="en" href="https://riad-guest-hub.vercel.app/" />
    <link rel="alternate" hreflang="fr" href="https://riad-guest-hub.vercel.app/" />
    
    <!-- Dynamic meta update script -->
    <script>
      // Update meta tags based on browser language
      (function() {
        const userLang = navigator.language || navigator.userLanguage;
        const isFrench = userLang.toLowerCase().startsWith('fr');
        
        const translations = {
          fr: {
            title: "Margo Guest App | Votre Conciergerie Digitale",
            description: "Accédez à votre portail personnalisé pour le check-in, les services et les recommandations locales.",
          },
          en: {
            title: "Margo Guest App | Your Digital Concierge",
            description: "Access your personalized guest portal for check-in, services, and local recommendations.",
          }
        };
        
        const lang = isFrench ? 'fr' : 'en';
        const t = translations[lang];
        
        // Update title
        document.title = t.title;
        
        // Update meta description
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.content = t.description;
        
        // Update OG tags
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.content = t.title;
        
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.content = t.description;
        
        // Update Twitter tags
        const twitterTitle = document.querySelector('meta[name="twitter:title"]');
        if (twitterTitle) twitterTitle.content = t.title;
        
        const twitterDesc = document.querySelector('meta[name="twitter:description"]');
        if (twitterDesc) twitterDesc.content = t.description;
        
        // Update html lang attribute
        document.documentElement.lang = lang;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
